services:
  - type: web
    name: nexamail-campus
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: NODE_ENV=production npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.18.0"
      - key: APP_URL
        value: "https://email-categorization-tbkl.onrender.com"
      - key: CAMPUS_ALLOWED_DOMAINS
        value: "rvce.edu.in"
      - key: GEMINI_API_KEY
        sync: false
